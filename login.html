<!doctype html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Infinity ∞</title>
<link rel="manifest" href="manifest-v5.json">
<link rel="apple-touch-icon" href="apple-touch-icon-v5.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v5.png">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Infinity">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0d151c;--surface:#16212b;--ink:#e6ecf1;--muted:#93a1ad;--line:#26333f;--accent:#f0a24a;--accent-soft:#3a2a17;--bad:#e57373;
--f-display:"Unbounded",system-ui,sans-serif;--f-body:"Manrope",-apple-system,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:var(--f-body);padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:18px}
.logo{width:88px;height:88px;border-radius:20px;display:block}
.title{font-family:var(--f-display);font-weight:500;font-size:22px;letter-spacing:.06em;color:var(--accent);text-align:center}
.sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:-10px}
form{width:100%;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
label{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
input{font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:700;font-size:15px;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#1a1206;cursor:pointer;margin-top:4px}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--bad);font-size:13px;min-height:18px;text-align:center}
</style></head>
<body>
<div class="card">
  <img class="logo" src="logo-tile-v5.png" alt="">
  <div><div class="title">INFINITY</div><div class="sub">Вхід у застосунок</div></div>
  <form id="f" autocomplete="on">
    <label for="u">Логін</label>
    <input id="u" name="user" type="text" autocomplete="username" required autofocus>
    <label for="p">Пароль</label>
    <input id="p" name="pass" type="password" autocomplete="current-password" required>
    <div class="err" id="err" role="alert"></div>
    <button id="btn" type="submit">Увійти</button>
  </form>
</div>
<script>
const f=document.getElementById("f"),err=document.getElementById("err"),btn=document.getElementById("btn");
f.addEventListener("submit",async e=>{
  e.preventDefault();
  err.textContent="";btn.disabled=true;btn.textContent="Перевіряю…";
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:document.getElementById("u").value,pass:document.getElementById("p").value})});
    if(r.ok){location.href="/";return}
    const j=await r.json().catch(()=>({}));
    err.textContent=j.error==="locked"?"Забагато спроб. Спробуй через 15 хвилин.":"Невірний логін або пароль.";
  }catch(e){err.textContent="Зв'язок перервався. Спробуй ще раз."}
  btn.disabled=false;btn.textContent="Увійти";
});
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){try{console.error('SW register failed:',e)}catch(err){}});
  });
}
</script>
</body></html>
